<section class="relative overflow-hidden">
  <div class="pointer-events-none absolute inset-0 -z-10 bg-slate-50 dark:bg-slate-950">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 size-96 rounded-full bg-violet-400/20 dark:bg-violet-600/10 blur-3xl"></div>
  </div>

  <div class="mx-auto max-w-3xl px-6 py-20">
    <div class="text-center mb-14">
      <div class="mx-auto grid size-14 place-items-center rounded-2xl bg-gradient-to-br from-violet-600 to-cyan-500 text-white shadow-lg shadow-violet-500/25">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h9" />
        </svg>
      </div>
      <h1 class="mt-5 font-display text-3xl font-bold text-slate-900 dark:text-white">{{ t().blog.heading }}</h1>
    </div>

    @if (posts().length) {
      <div class="space-y-5">
        @for (post of posts(); track post.slug) {
          <a [routerLink]="[postLinkPrefix(), post.slug]"
             class="group block rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/[0.03] p-6 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-violet-500/10 hover:border-violet-300 dark:hover:border-violet-500/40 transition-all">
            <p class="text-xs font-semibold text-violet-600 dark:text-violet-400">{{ post.date }} &middot; {{ post.category }}</p>
            <h2 class="mt-1.5 font-display text-lg font-semibold text-slate-900 dark:text-white leading-snug group-hover:text-violet-600 dark:group-hover:text-violet-400 transition-colors">{{ post.title }}</h2>
            <p class="mt-2 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">{{ post.excerpt }}</p>
            <span class="mt-3 inline-flex items-center gap-1 text-sm font-semibold text-violet-600 dark:text-violet-400">
              {{ t().caseStudies.readMore }}
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-3.5 transition-transform group-hover:translate-x-0.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
              </svg>
            </span>
          </a>
        }
      </div>
    } @else {
      <p class="text-center text-slate-600 dark:text-slate-300">{{ t().blog.empty }}</p>
    }
  </div>
</section>
