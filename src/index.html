<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Concensur | Full-stack .NET-udvikler</title>
  <meta name="description" content="Softwareudvikler med speciale i full-stack .NET-udvikling i skalerede arkitekturer. Tager freelanceprojekter inden for webudvikling, e-commerce og automatisering.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      var stored = localStorage.getItem('concensur-theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>
<body class="bg-white dark:bg-slate-950 transition-colors">
  <app-root></app-root>
</body>
</html>
