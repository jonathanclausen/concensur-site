<header class="border-b border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-slate-950/70 backdrop-blur-lg sticky top-0 z-50 transition-colors">
  <nav class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <span class="grid size-8 place-items-center rounded-lg bg-gradient-to-br from-violet-600 to-cyan-500 font-display font-bold text-white text-sm shadow-lg shadow-violet-500/25 group-hover:scale-105 transition-transform">
        C
      </span>
      <span class="font-display text-lg font-semibold tracking-tight text-slate-900 dark:text-white">
        Concensur
      </span>
    </a>

    <div class="flex items-center gap-6">
      <div class="hidden sm:flex gap-6 text-sm font-medium text-slate-600 dark:text-slate-300">
        <a routerLink="/" routerLinkActive="text-slate-900 dark:text-white" [routerLinkActiveOptions]="{ exact: true }"
           class="relative py-1 hover:text-slate-900 dark:hover:text-white transition-colors">{{ t().nav.home }}</a>
        <a routerLink="/blog" routerLinkActive="text-slate-900 dark:text-white"
           class="relative py-1 hover:text-slate-900 dark:hover:text-white transition-colors">{{ t().nav.blog }}</a>
      </div>

      <div class="flex items-center gap-1">
        <div class="flex items-center rounded-full border border-slate-200 dark:border-white/10 bg-slate-100/70 dark:bg-white/5 p-0.5 text-xs font-semibold text-slate-500 dark:text-slate-400">
          <button type="button" (click)="setLang('da')"
                  [ngClass]="lang() === 'da' ? 'bg-white dark:bg-white/10 text-slate-900 dark:text-white shadow-sm' : ''"
                  class="rounded-full px-2.5 py-1 transition-all"
                  aria-label="Dansk">DA</button>
          <button type="button" (click)="setLang('en')"
                  [ngClass]="lang() === 'en' ? 'bg-white dark:bg-white/10 text-slate-900 dark:text-white shadow-sm' : ''"
                  class="rounded-full px-2.5 py-1 transition-all"
                  aria-label="English">EN</button>
        </div>

        <button type="button" (click)="toggleTheme()"
                class="ml-1 rounded-full p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/10 transition-colors"
                [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
          @if (theme() === 'dark') {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-4.5">
              <circle cx="12" cy="12" r="4" />
              <path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-4.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
          }
        </button>
      </div>
    </div>
  </nav>
</header>
